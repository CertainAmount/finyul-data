<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 284" role="img" aria-label="연금저축 600만 원 그릇이 합산 900만 원 그릇 안에 있어요. 배분 D(연금저축 700만 원 + IRP 200만 원) 예시에서는 넘친 100만 원이 빠져 800만 원만 인정돼요" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <text x="20" y="24" font-size="15" fill="#282d35">한도 구조: 합산 900만 원</text>
    <rect x="10" y="32" width="380" height="66" rx="6" fill="#f2f6fb" stroke="#254a75" stroke-width="2"/>
    <rect x="20" y="44" width="240" height="42" fill="#ffffff" stroke="#254a75" stroke-width="1.5"/>
    <text x="30" y="70" font-size="15" fill="#282d35">연금저축 600만 원 이내</text>
    <text x="320" y="62" font-size="15" fill="#282d35" text-anchor="middle">IRP</text>
    <text x="320" y="78" font-size="15" fill="#282d35" text-anchor="middle">남은 300만 원</text>
    <text x="20" y="126" font-size="15" fill="#282d35">배분 D: 연금저축 700 + IRP 200</text>
    <rect x="10" y="134" width="380" height="66" rx="6" fill="#f2f6fb" stroke="#254a75" stroke-width="2"/>
    <rect x="20" y="146" width="240" height="42" fill="#254a75" stroke="#ffffff" stroke-width="2"/>
    <text x="30" y="172" font-size="15" fill="#ffffff">연금저축 600 인정</text>
    <rect x="260" y="146" width="80" height="42" fill="#254a75" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="172" font-size="15" fill="#ffffff" text-anchor="middle">IRP 200</text>
    <rect x="340" y="146" width="40" height="42" fill="none" stroke="#6f7783" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="40" y1="188" x2="40" y2="212" stroke="#b4532a" stroke-width="2"/>
    <path d="M34 210 L40 220 L46 210 Z" fill="#b4532a"/>
    <rect x="20" y="222" width="40" height="26" fill="none" stroke="#b4532a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="70" y="240" font-size="15" fill="#b4532a">넘친 100만 원은 인정 안 됨</text>
    <text x="20" y="274" font-size="15" fill="#254a75">인정 800만 원 = 600 + 200</text>
  </svg>
