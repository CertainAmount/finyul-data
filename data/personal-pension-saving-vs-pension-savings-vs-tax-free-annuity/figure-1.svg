<text x="226" y="162" font-size="15" fill="#6f7783" text-anchor="start">01.1~ · 13.3부터 계좌</text>
<rect x="8" y="188" width="130" height="52" rx="4" fill="#f2f6fb" stroke="#6f7783"/>
<text x="18" y="210" font-size="15" fill="#282d35" text-anchor="start">어머니 보험</text>
<text x="18" y="230" font-size="15" fill="#6f7783" text-anchor="start">2014년 가입</text>
<line x1="140" y1="214" x2="206" y2="214" stroke="#254a75" stroke-width="2"/>
<polygon points="214,214 205,209 205,219" fill="#254a75"/>
<rect x="216" y="188" width="176" height="52" rx="4" fill="#fff" stroke="#254a75" stroke-width="2"/>
<text x="226" y="210" font-size="15" fill="#282d35" text-anchor="start">세제혜택이 없는</text>
<text x="226" y="230" font-size="15" fill="#6f7783" text-anchor="start">개인연금</text>
<rect x="8" y="256" width="130" height="52" rx="4" fill="#f2f6fb" stroke="#6f7783"/>
<text x="18" y="278" font-size="15" fill="#282d35" text-anchor="start">아버지 계약</text>
