<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" role="img" aria-label="네 계약이 포털 구분 칸에서 갈리는 곳" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<rect x="8" y="8" width="130" height="52" rx="4" fill="#f2f6fb" stroke="#6f7783"/>
<text x="18" y="30" font-size="15" fill="#282d35" text-anchor="start">내 DC·IRP</text>

<line x1="140" y1="34" x2="206" y2="34" stroke="#6f7783" stroke-width="2" stroke-dasharray="4 3"/>
<polygon points="214,34 205,29 205,39" fill="#6f7783"/>
<rect x="216" y="8" width="176" height="52" rx="4" fill="#fff" stroke="#6f7783" stroke-width="2" stroke-dasharray="4 3"/>
<text x="226" y="30" font-size="15" fill="#282d35" text-anchor="start">퇴직연금</text>
