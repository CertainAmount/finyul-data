<text x="10" y="100" font-size="15" fill="#254a75" text-anchor="start">포털의 ‘개인연금’ 안</text>
<rect x="208" y="112" width="192" height="212" rx="6" fill="none" stroke="#254a75" stroke-dasharray="2 3"/>
<line x1="208" y1="86" x2="400" y2="86" stroke="none"/>
<rect x="8" y="120" width="130" height="52" rx="4" fill="#f2f6fb" stroke="#6f7783"/>
<text x="18" y="142" font-size="15" fill="#282d35" text-anchor="start">내 연금저축펀드</text>
<text x="18" y="162" font-size="15" fill="#6f7783" text-anchor="start"></text>
<line x1="140" y1="146" x2="206" y2="146" stroke="#254a75" stroke-width="2"/>
<polygon points="214,146 205,141 205,151" fill="#254a75"/>
<rect x="216" y="120" width="176" height="52" rx="4" fill="#fff" stroke="#254a75" stroke-width="2"/>
