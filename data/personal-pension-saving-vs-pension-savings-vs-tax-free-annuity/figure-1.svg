<polygon points="214,282 205,277 205,287" fill="#254a75"/>
<rect x="216" y="256" width="176" height="52" rx="4" fill="#fff" stroke="#254a75" stroke-width="2"/>
<text x="226" y="278" font-size="15" fill="#282d35" text-anchor="start">舊 개인연금저축</text>
<text x="226" y="298" font-size="15" fill="#6f7783" text-anchor="start">94.6~00.12 판매</text>
