<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 260 248" role="img" aria-label="퇴직금 평균임금 계산 순서" style="width:100%;height:auto;max-width:22rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><marker id="pf-arrow" viewbox="0 0 8 8" refx="6" refy="4" markerwidth="6" markerheight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cbcfd6"></path></marker></defs><g><rect x="12" y="12" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="32" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="0">1. 석 달 임금총액</tspan></text><line x1="130" y1="52" x2="130" y2="70" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="74" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="-6.5">2. ÷ 총일수(89~92일)</tspan><tspan x="130" dy="13">= 하루치</tspan></text><line x1="130" y1="114" x2="130" y2="132" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="136" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="156" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="0">3. × 30 × 근속연수</tspan></text><line x1="130" y1="176" x2="130" y2="194" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="198" width="236" height="40" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"></rect><text x="130" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#374151"><tspan x="130" dy="-6.5">4. 하루치가 통상임금</tspan><tspan x="130" dy="13">하루치보다 작으면 통상임금 하루치로</tspan></text></g></svg>
