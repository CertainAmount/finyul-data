<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="상속세가 0원인 금액 자녀만 5억, 배우자 함께 10억" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<text x="20" y="26" font-size="15" fill="#282d35">자녀만 받으면</text>
<rect x="20" y="36" width="180" height="36" fill="#254a75"/>
<text x="110" y="59" font-size="15" fill="#ffffff" text-anchor="middle">일괄공제 5억</text>
<line x1="200" y1="30" x2="200" y2="78" stroke="#b4532a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="210" y="52" font-size="15" fill="#b4532a">여기부터 넘은 금액에만</text>
<text x="210" y="70" font-size="15" fill="#b4532a">세금을 내요</text>
<text x="20" y="112" font-size="15" fill="#282d35">배우자와 함께 받으면</text>
<rect x="20" y="122" width="180" height="36" fill="#254a75"/>
<text x="110" y="145" font-size="15" fill="#ffffff" text-anchor="middle">일괄공제 5억</text>
<rect x="200" y="122" width="180" height="36" fill="#f2f6fb" stroke="#254a75" stroke-width="2"/>
<text x="290" y="145" font-size="15" fill="#254a75" text-anchor="middle">배우자공제 5억</text>
<line x1="380" y1="116" x2="380" y2="166" stroke="#b4532a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="380" y="188" font-size="15" fill="#b4532a" text-anchor="end">여기부터 넘은 금액에만 세금을 내요</text>
</svg>
