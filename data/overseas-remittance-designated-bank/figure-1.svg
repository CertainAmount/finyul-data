nt-size="12.5" fill="#525a66">예</text><line x1="90" y1="132" x2="90" y2="154" stroke="#cbcfd6" stroke-width="1.6" marker-end="url(#rnf-arrow)"></line><line x1="270" y1="132" x2="270" y2="154" stroke="#cbcfd6" stroke-width="1.6" marker-end="url(#rnf-arrow)"></line><g><rect x="15" y="156" width="150" height="46" rx="6" fill="#eaf0f8" stroke="#254a75" stroke-width="1.4"></rect><text x="90" y="179" text-anchor="middle" font-size="12.5" font-weight="400" fill="#525a66"><tspan x="90" dy="-3.5999999999999996">넘으면</tspan><tspan x="90" dy="16">국세청 통보</tspan></text></g><g><rect x="195" y="156" width="150" height="46" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4"></rect><text x="270" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#525a66"><tspan x="270" dy="-3.5999999999999996">보낸 내역 전부</tspan><tspan x="270" dy="16">매월 국세청 통보</tspan></text></g></svg>
