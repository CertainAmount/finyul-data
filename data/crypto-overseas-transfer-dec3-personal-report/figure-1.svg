<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 340 370" role="img" aria-label="코인 해외 전송 신고 판정. 두 질문은 서로 독립이라 둘 다 해당할 수 있다. 질문 1. 보내는 코인이 내 돈이고 받는 곳도 내 계정·지갑인가? 예이면 개정으로 내가 낼 신고서 없음 (통보는 사업자가 해요). 아니오이면 남의 돈을 받아 환전·지급하면 이번 개정과 별개 위험. 질문 2. 해외 계좌 월말 잔액 합계가 5억원을 넘은 달이 있나? 예이면 해외금융계좌 신고 대상 (다음 해 6월). 아니오이면 해당 없음 (내 지갑에 직접 보관도 포함)." style="width:100%;height:auto;max-width:30rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><marker id="ctr-arrow" viewbox="0 0 8 8" refx="6" refy="4" markerwidth="6" markerheight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cbcfd6"></path></marker></defs><g><text x="14" y="16" font-size="11.5" font-weight="700" fill="#254a75">질문 1</text><g><rect x="14" y="24" width="312" height="48" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="170" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151"><tspan x="170" dy="-7.5">보내는 코인이 내 돈이고</tspan><tspan x="170" dy="15">받는 곳도 내 계정·지갑인가</tspan></text></g><path d="M170,72 L170,84 L89,84 L89,104" fill="none" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#ctr-arrow)"></path><text x="95" y="99" font-size="11.5" fill="#15803d">예</text><g><rect x="14" y="108" width="150" height="58" rx="6" fill="#eef7f0" stroke="#15803d" stroke-width="1.4"></rect><text x="89" y="141" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151"><tspan x="89" dy="-15">개정으로 내가 낼</tspan><tspan x="89" dy="15">신고서 없음</tspan><tspan x="89" dy="15">(통보는 사업자가 해요)</tspan></text></g><path d="M170,72 L170,84 L251,84 L251,104" fill="none" stroke="#cbcfd6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ctr-arrow)"></path><text x="257" y="99" font-size="11.5" fill="#9a3412">아니오</text><g><rect x="176" y="108" width="150" height="58" rx="6" fill="#fdf1ec" stroke="#9a3412" stroke-width="1.4"></rect><text x="251" y="141" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151"><tspan x="251" dy="-15">남의 돈을 받아</tspan><tspan x="251" dy="15">환전·지급하면</tspan><tspan x="251" dy="15">이번 개정과 별개 위험</tspan></text></g></g><g><text x="14" y="212" font-size="11.5" font-weight="700" fill="#254a75">질문 2</text><g><rect x="14" y="220" width="312" height="48" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="170" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151"><tspan x="170" dy="-7.5">해외 계좌 월말 잔액 합계가</tspan><tspan x="170" dy="15">5억원을 넘은 달이 있나</tspan></text></g><path d="M170,268 L170,280 L89,280 L89,300" fill="none" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#ctr-arrow)"></path><text x="95" y="295" font-size="11.5" fill="#15803d">예</text><g><rect x="14" y="304" width="150" height="58" rx="6" fill="#fdf1ec" stroke="#9a3412" stroke-width="1.4"></rect><text x="89" y="337" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151"><tspan x="89" dy="-7.5">해외금융계좌 신고 대상</tspan><tspan x="89" dy="15">(다음 해 6월)</tspan></text></g><path d="M170,268 L170,280 L251,280 L251,300" fill="none" stroke="#cbcfd6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ctr-arrow)"></path><text x="257" y="295" font-size="11.5" fill="#9a3412">아니오</text><g><rect x="176" y="304" width="150" height="58" rx="6" fill="#eef7f0" stroke="#15803d" stroke-width="1.4"></rect><text x="251" y="337" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151"><tspan x="251" dy="-15">해당 없음</tspan><tspan x="251" dy="15">(내 지갑에 직접</tspan><tspan x="251" dy="15">보관도 포함)</tspan></text></g></g><line x1="14" y1="183" x2="326" y2="183" stroke="#cbcfd6" stroke-width="1" stroke-dasharray="2 4"></line><rect x="66" y="173" width="208" height="20" rx="10" fill="#ffffff" stroke="#cbcfd6"></rect><text x="170" y="187" text-anchor="middle" font-size="11.5" fill="#374151">서로 독립 · 둘 다 해당할 수 있어요</text></svg>
