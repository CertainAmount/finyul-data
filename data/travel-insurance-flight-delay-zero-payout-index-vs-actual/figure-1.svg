<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" role="img" aria-label="같은 5시간 지연이 지수형과 실손형에서 갈리는 길" font-family="Pretendard, 'Noto Sans KR', sans-serif"><rect x="110" y="8" width="180" height="34" rx="6" fill="#254a75" stroke="#254a75" stroke-width="1"/><text x="200" y="30" text-anchor="middle" font-size="15" fill="#ffffff">같은 5시간 지연</text><line x1="200" y1="42" x2="200" y2="56" stroke="#6f7783" stroke-width="1.5"/><line x1="100" y1="56" x2="300" y2="56" stroke="#6f7783" stroke-width="1.5"/><line x1="100" y1="56" x2="100" y2="70" stroke="#6f7783" stroke-width="1.5"/><line x1="300" y1="56" x2="300" y2="70" stroke="#6f7783" stroke-width="1.5"/><rect x="10" y="70" width="180" height="34" rx="6" fill="#f2f6fb" stroke="#254a75" stroke-width="1"/><text x="100" y="92" text-anchor="middle" font-size="15" fill="#282d35">지수형: 시간만 잰다</text><rect x="210" y="70" width="180" height="34" rx="6" fill="#f2f6fb" stroke="#254a75" stroke-width="1"/><text x="300" y="92" text-anchor="middle" font-size="15" fill="#282d35">실손형: 쓴 돈 갚기</text><line x1="100" y1="104" x2="100" y2="118" stroke="#6f7783" stroke-width="1.5"/><line x1="300" y1="104" x2="300" y2="118" stroke="#6f7783" stroke-width="1.5"/><rect x="10" y="118" width="180" height="34" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1"/><text x="100" y="140" text-anchor="middle" font-size="15" fill="#282d35">기준 시간 넘었나?</text><rect x="210" y="118" width="180" height="34" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1"/><text x="300" y="140" text-anchor="middle" font-size="15" fill="#282d35">지출·영수증 있나?</text><line x1="100" y1="152" x2="50" y2="196" stroke="#6f7783" stroke-width="1.5"/><line x1="100" y1="152" x2="150" y2="196" stroke="#6f7783" stroke-width="1.5"/><line x1="300" y1="152" x2="250" y2="196" stroke="#6f7783" stroke-width="1.5"/><line x1="300" y1="152" x2="350" y2="196" stroke="#6f7783" stroke-width="1.5"/><text x="44" y="178" text-anchor="end" font-size="15" fill="#282d35">예</text><text x="160" y="178" text-anchor="start" font-size="15" fill="#282d35">아니오</text><text x="244" y="178" text-anchor="end" font-size="15" fill="#282d35">있음</text><text x="360" y="178" text-anchor="start" font-size="15" fill="#282d35">없음</text><rect x="4" y="196" width="92" height="50" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1"/><text x="50" y="217" text-anchor="middle" font-size="15" fill="#282d35">정액</text><text x="50" y="237" text-anchor="middle" font-size="15" fill="#282d35">지급</text><rect x="104" y="196" width="92" height="50" rx="6" fill="#ffffff" stroke="#b4532a" stroke-width="2"/><text x="150" y="226" text-anchor="middle" font-size="15" fill="#282d35">0원</text><rect x="204" y="196" width="92" height="50" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1"/><text x="250" y="217" text-anchor="middle" font-size="15" fill="#282d35">한도 안</text><text x="250" y="237" text-anchor="middle" font-size="15" fill="#282d35">실비 지급</text><rect x="304" y="196" width="92" height="50" rx="6" fill="#ffffff" stroke="#b4532a" stroke-width="2"/><text x="350" y="226" text-anchor="middle" font-size="15" fill="#282d35">0원</text><line x1="350" y1="246" x2="350" y2="262" stroke="#b4532a" stroke-width="1.5"/><text x="350" y="282" text-anchor="middle" font-size="15" fill="#b4532a">동료는 여기</text><line x1="150" y1="246" x2="150" y2="262" stroke="#6f7783" stroke-width="1.5" stroke-dasharray="4 3"/><text x="150" y="282" text-anchor="middle" font-size="15" fill="#6f7783">기준이 5시간보다</text><text x="150" y="302" text-anchor="middle" font-size="15" fill="#6f7783">길면 (필자 해석)</text></svg>
