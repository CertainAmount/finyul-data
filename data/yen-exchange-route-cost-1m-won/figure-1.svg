<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 360 206" role="img" aria-label="기준선보다 적게 받는 엔: 은행 앱 우대 90% 약 200엔, 은행 앱 우대 50% 약 1,000엔, 우대 없음 약 2,000엔, 공항 창구 즉석 약 5,000엔, 트래블카드(가정) 0~1,200엔" style="width:100%;height:auto;max-width:30rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><pattern id="jpy-hatch" width="6" height="6" patternunits="userSpaceOnUse" patterntransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#254a75" stroke-width="2.5"></line></pattern></defs><text x="8" y="16" font-size="12.2" font-weight="700" fill="#374151">기준선보다 적게 받는 엔 (100만 원 기준)</text><g><text x="112" y="44" text-anchor="end" font-size="12.2" fill="#374151">은행 앱 우대 90%</text><rect x="118" y="33" width="6.88" height="16" fill="#254a75" stroke="#254a75" stroke-width="1"></rect><text x="129.88" y="45" font-size="12.2" font-weight="600" fill="#374151">약 200</text></g><g><text x="112" y="74" text-anchor="end" font-size="12.2" fill="#374151">은행 앱 우대 50%</text><rect x="118" y="63" width="34.4" height="16" fill="#254a75" stroke="#254a75" stroke-width="1"></rect><text x="157.4" y="75" font-size="12.2" font-weight="600" fill="#374151">약 1,000</text></g><g><text x="112" y="104" text-anchor="end" font-size="12.2" fill="#374151">우대 없음</text><rect x="118" y="93" width="68.8" height="16" fill="#254a75" stroke="#254a75" stroke-width="1"></rect><text x="191.8" y="105" font-size="12.2" font-weight="600" fill="#374151">약 2,000</text></g><g><text x="112" y="134" text-anchor="end" font-size="12.2" fill="#374151">공항 창구 즉석</text><rect x="118" y="123" width="172" height="16" fill="#254a75" stroke="#254a75" stroke-width="1"></rect><text x="295" y="135" font-size="12.2" font-weight="600" fill="#374151">약 5,000</text></g><g><text x="112" y="164" text-anchor="end" font-size="12.2" fill="#374151">트래블카드(가정)</text><rect x="118" y="153" width="41.28" height="16" fill="url(#jpy-hatch)" stroke="#254a75" stroke-width="1"></rect><text x="164.28" y="165" font-size="12.2" font-weight="600" fill="#374151">0~1,200</text></g><line x1="118" y1="26" x2="118" y2="180" stroke="#9ca3af" stroke-width="1"></line><text x="118" y="200" font-size="12.2" fill="#6b7280">0엔(기준선)</text><text x="290" y="200" text-anchor="end" font-size="12.2" fill="#6b7280">5,000엔</text></svg>
