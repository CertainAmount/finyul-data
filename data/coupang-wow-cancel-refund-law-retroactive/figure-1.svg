<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 400 190" role="img" aria-label="와우 멤버십 결제 주기와 해지 시점" style="width:100%;height:auto;max-width:30rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><path d="M40 40 V34 H360 V40" fill="none" stroke="#254a75" stroke-width="1.4"></path><text x="200" y="24" text-anchor="middle" font-size="13.5" fill="#525a66">해당 월 = 결제일부터 한 주기(28~31일)?</text><line x1="30" y1="84" x2="385" y2="84" stroke="#cbcfd6" stroke-width="1.6"></line><circle cx="40" cy="84" r="5" fill="#254a75"></circle><text x="40" y="106" text-anchor="middle" font-size="13.5" fill="#525a66">3/15</text><text x="40" y="123" text-anchor="middle" font-size="13.5" fill="#525a66">결제</text><circle cx="205" cy="84" r="4" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></circle><circle cx="226" cy="84" r="5.5" fill="#b45309"></circle><text x="230" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66">4/2</text><text x="230" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66">해지</text><circle cx="344" cy="84" r="5" fill="#254a75"></circle><circle cx="360" cy="84" r="5" fill="#254a75"></circle><text x="352" y="106" text-anchor="middle" font-size="13.5" fill="#525a66">4/12~15</text><text x="352" y="123" text-anchor="middle" font-size="13.5" fill="#525a66">다음 결제</text><path d="M40 134 V140 H205 V134" fill="none" stroke="#254a75" stroke-width="1.4" stroke-dasharray="4 3"></path><text x="122" y="158" text-anchor="middle" font-size="13.5" fill="#525a66">해당 월 = 3월(3/31까지)?</text><text x="200" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66">약관은 둘 중 어느 쪽인지 날짜로 정하지 않음</text></svg>
