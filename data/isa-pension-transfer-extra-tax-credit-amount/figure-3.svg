<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="12% 구간 공제 36만원과 뺄 때 세금 15만원·45만원 비교" font-family="Pretendard, 'Noto Sans KR', sans-serif">
