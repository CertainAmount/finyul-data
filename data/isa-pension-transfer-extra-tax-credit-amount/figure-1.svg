    <line x1="30" y1="36" x2="30" y2="46" stroke="#254a75" stroke-width="2"/>
    <line x1="370" y1="36" x2="370" y2="46" stroke="#254a75" stroke-width="2"/>
    <rect x="30" y="56" width="170" height="44" fill="#f2f6fb" stroke="#254a75" stroke-width="2"/>
