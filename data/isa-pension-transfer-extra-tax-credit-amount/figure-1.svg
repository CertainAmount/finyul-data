<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="기본 한도 900만원 위에 추가 300만원이 얹히는 한도 구조" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <text x="200" y="24" font-size="15" text-anchor="middle" fill="#282d35">공제 대상 최대 1,200만원</text>
