<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 400 212" role="img" aria-label="퇴직금 중간정산과 세금 연수 계산" style="width:100%;height:auto;max-width:30rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><line x1="140" y1="20" x2="140" y2="206" stroke="#cbcfd6" stroke-width="1.2" stroke-dasharray="3 3"></line><line x1="20" y1="24" x2="380" y2="24" stroke="#cbcfd6" stroke-width="1.6"></line><circle cx="20" cy="24" r="3.5" fill="#254a75"></circle><circle cx="140" cy="24" r="3.5" fill="#254a75"></circle><circle cx="380" cy="24" r="3.5" fill="#254a75"></circle><text x="20" y="13" font-size="13.5" fill="#525a66" text-anchor="start">입사</text><text x="140" y="13" font-size="13.5" fill="#525a66" font-weight="700" text-anchor="middle">정산(5년 차)</text><text x="380" y="13" font-size="13.5" fill="#525a66" text-anchor="end">퇴사(+10년)</text><text x="20" y="50" font-size="13.5" font-weight="700" fill="#254a75">퇴직금 시계</text><g><rect x="20" y="56" width="118" height="26" rx="5" fill="#f3f4f6" stroke="#254a75" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="79" y="74" text-anchor="middle" font-size="13.5" font-weight="400" fill="#525a66">정산 때 지급 끝</text></g><g><rect x="142" y="56" width="238" height="26" rx="5" fill="#eaf1fb" stroke="#254a75" stroke-width="1.4"></rect><text x="261" y="74" text-anchor="middle" font-size="13.5" font-weight="400" fill="#525a66">정산 시점부터 새로 계산(10년)</text></g><text x="20" y="104" font-size="13.5" font-weight="700" fill="#b45309">세금 시계</text><text x="20" y="122" font-size="13.5" fill="#525a66" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="paint-order:stroke">영수증 안 내면: 따로 계산</text><g><rect x="20" y="128" width="118" height="26" rx="5" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="79" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66">5년</text></g><g><rect x="142" y="128" width="238" height="26" rx="5" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4"></rect><text x="261" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66">10년</text></g><text x="20" y="170" font-size="13.5" fill="#525a66" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="paint-order:stroke">영수증 내면: 합쳐서 정산</text><g><rect x="20" y="176" width="360" height="26" rx="5" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4"></rect><text x="200" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66">15년 합산</text></g></svg>
