<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 380 386" role="img" aria-label="카드론 상환 후 신용회복 시간표 선택" style="width:100%;height:auto;max-width:30rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><marker id="clr-arrow" viewbox="0 0 8 8" refx="6" refy="4" markerwidth="6" markerheight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"></path></marker></defs><text x="8" y="17" font-size="12.9" font-weight="700" fill="#374151">갚은 뒤, 어느 시간표를 볼까요?</text><g><rect x="110" y="28" width="180" height="30" rx="6" fill="#eef3f9" stroke="#254a75" stroke-width="1.4"></rect><text text-anchor="middle" font-size="12.9" font-weight="700" fill="#374151"><tspan x="200" y="47">카드론을 갚았거나 갚는 중</tspan></text></g><line x1="200" y1="58" x2="200" y2="80" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#clr-arrow)"></line><g><rect x="110" y="84" width="180" height="34" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text text-anchor="middle" font-size="12.9" font-weight="400" fill="#374151"><tspan x="200" y="105">연체한 적이 있나요?</tspan></text></g><path d="M110,101 H86 V148" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#clr-arrow)"></path><text x="80" y="142" text-anchor="end" font-size="12.9" fill="#9a3412">아니요</text><g><rect x="6" y="152" width="160" height="140" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"></rect><text text-anchor="middle" font-size="12.9" font-weight="400" fill="#374151"><tspan x="86" y="170">금감원 예시: 고금리</tspan><tspan x="86" y="186">대출은 연체 없는</tspan><tspan x="86" y="202">거래가 쌓여</tspan><tspan x="86" y="218">회복되기까지 일정</tspan><tspan x="86" y="234">기간(예: 최장</tspan><tspan x="86" y="250">3년)이 걸릴 수</tspan><tspan x="86" y="266">있어요. 카드론을 직접</tspan><tspan x="86" y="282">가리킨 숫자는 없어요</tspan></text></g><path d="M290,101 H300 V148" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#clr-arrow)"></path><text x="306" y="142" font-size="12.9" fill="#15803d">예</text><g><rect x="192" y="152" width="144" height="44" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text text-anchor="middle" font-size="12.9" font-weight="400" fill="#374151"><tspan x="264" y="170">연체가 90일</tspan><tspan x="264" y="186">이상인가요?</tspan></text></g><line x1="264" y1="196" x2="264" y2="222" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#clr-arrow)"></line><text x="270" y="216" font-size="12.9" fill="#15803d">예</text><g><rect x="192" y="226" width="144" height="60" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"></rect><text text-anchor="middle" font-size="12.9" font-weight="400" fill="#374151"><tspan x="264" y="244">연체 정보를 최장</tspan><tspan x="264" y="260">5년 평가에 써요,</tspan><tspan x="264" y="276">갚으면 서서히 올라요</tspan></text></g><path d="M336,174 H366 V346 H340" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#clr-arrow)"></path><text x="358" y="168" text-anchor="middle" font-size="12.9" fill="#9a3412">아니요</text><g><rect x="192" y="316" width="144" height="60" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"></rect><text text-anchor="middle" font-size="12.9" font-weight="400" fill="#374151"><tspan x="264" y="334">최장 3년 평가에</tspan><tspan x="264" y="350">써요, 갚으면 서서히</tspan><tspan x="264" y="366">올라요</tspan></text></g></svg>
