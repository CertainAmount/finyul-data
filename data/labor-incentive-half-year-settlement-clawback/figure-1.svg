<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 400 170" role="img" aria-label="근로장려금 환수 순서" style="width:100%;height:auto;max-width:26rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><marker id="licof-arrow" viewbox="0 0 8 8" refx="6" refy="4" markerwidth="6" markerheight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#cbcfd6"></path></marker></defs><g><rect x="8" y="6" width="384" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="200" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66"><tspan x="200" dy="4.5">1호: 그 과세기간 자녀장려금에서 먼저 차감</tspan></text></g><line x1="79" y1="48" x2="79" y2="96" stroke="#cbcfd6" stroke-width="1.6" marker-end="url(#licof-arrow)"></line><text x="86" y="70" font-size="13.5" fill="#525a66"><tspan x="86">그래도 남으면 —</tspan><tspan x="86" dy="17">신청 없음(기본값)</tspan></text><line x1="321" y1="48" x2="321" y2="96" stroke="#cbcfd6" stroke-width="1.6" marker-end="url(#licof-arrow)"></line><text x="328" y="87" font-size="13.5" fill="#525a66">3호 신청</text><g><rect x="4" y="100" width="190" height="66" rx="6" fill="#eaf5ee" stroke="#166534" stroke-width="1.4"></rect><text x="99" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66"><tspan x="99" dy="-12.5">2호(기본값)</tspan><tspan x="99" dy="17">10개 과세기간 분할차감</tspan><tspan x="99" dy="17">— 현금 유출 없음</tspan></text></g><g><rect x="206" y="100" width="190" height="66" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4"></rect><text x="301" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#525a66"><tspan x="301" dy="-12.5">3호(신청 시)</tspan><tspan x="301" dy="17">소득세로 즉시 고지</tspan><tspan x="301" dy="17">— 당장 현금 필요</tspan></text></g></svg>
