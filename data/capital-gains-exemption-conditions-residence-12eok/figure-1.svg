<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 400 260" role="img" aria-label="비과세 거주요건 적용 시점 비교" style="width:100%;height:auto;max-width:30rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><text x="20" y="18" font-size="13.5" font-weight="700" fill="#b45309">(가) 공고 전에 계약금을 냈다</text><line x1="30" y1="66" x2="370" y2="66" stroke="#cbcfd6" stroke-width="1.6"></line><g><circle cx="60" cy="66" r="4" fill="#254a75"></circle><text x="60" y="54" font-size="13.5" text-anchor="middle" fill="#525a66" font-weight="400">계약금일</text><text x="60" y="88" font-size="13.5" text-anchor="middle" fill="#525a66">3월 2일</text></g><g><circle cx="200" cy="66" r="4" fill="#b45309"></circle><text x="200" y="54" font-size="13.5" text-anchor="middle" fill="#525a66" font-weight="700">공고일</text><text x="200" y="88" font-size="13.5" text-anchor="middle" fill="#525a66">3월 10일</text></g><g><circle cx="340" cy="66" r="4" fill="#254a75"></circle><text x="340" y="54" font-size="13.5" text-anchor="middle" fill="#525a66" font-weight="400">잔금일</text><text x="340" y="88" font-size="13.5" text-anchor="middle" fill="#525a66">5월 20일</text></g><text x="200" y="114" font-size="13.5" text-anchor="middle" fill="#525a66">계약금일에 세대가 무주택이면 거주 제한 없음</text><line x1="20" y1="130" x2="380" y2="130" stroke="#cbcfd6" stroke-width="1" stroke-dasharray="3 3"></line><text x="20" y="152" font-size="13.5" font-weight="700" fill="#254a75">(나) 공고 뒤에 계약했다</text><line x1="30" y1="200" x2="370" y2="200" stroke="#cbcfd6" stroke-width="1.6"></line><g><circle cx="60" cy="200" r="4" fill="#b45309"></circle><text x="60" y="188" font-size="13.5" text-anchor="middle" fill="#525a66" font-weight="700">공고일</text><text x="60" y="222" font-size="13.5" text-anchor="middle" fill="#525a66">3월 10일</text></g><g><circle cx="200" cy="200" r="4" fill="#254a75"></circle><text x="200" y="188" font-size="13.5" text-anchor="middle" fill="#525a66" font-weight="400">계약금일</text><text x="200" y="222" font-size="13.5" text-anc