<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 605" role="img" aria-label="개인워크아웃 접수와 접수통지 시간 도식" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<text x="101" y="24" font-size="15" text-anchor="middle" fill="#254a75" font-weight="700">나</text>
<text x="299" y="24" font-size="15" text-anchor="middle" fill="#254a75" font-weight="700">채권금융회사</text>
<rect x="6" y="38" width="190" height="56" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="15" y="60" font-size="15" text-anchor="start" fill="#282d35">인터넷·앱·전화로</text>
<text x="15" y="81" font-size="15" text-anchor="start" fill="#282d35">상담 예약</text>
<rect x="204" y="38" width="190" height="35" rx="4" fill="#f2f6fb" stroke="#6f7783"/>
<text x="213" y="60" font-size="15" text-anchor="start" fill="#282d35">아직 통지 없음</text>
<path d="M101 94 v8 m-4 -4 l4 4 l4 -4" fill="none" stroke="#6f7783"/>
<rect x="6" y="104" width="190" height="35" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="15" y="126" font-size="15" text-anchor="start" fill="#282d35">심사역과 전화상담</text>
<path d="M101 139 v8 m-4 -4 l4 4 l4 -4" fill="none" stroke="#6f7783"/>
<rect x="6" y="149" width="190" height="77" rx="4" fill="#f2f6fb" stroke="#254a75"/>
<text x="15" y="171" font-size="15" text-anchor="start" fill="#282d35">접수 끝</text>
<text x="15" y="192" font-size="15" text-anchor="start" fill="#282d35">이날부터 채권사에</text>
<text x="15" y="213" font-size="15" text-anchor="start" fill="#282d35">따로 갚기 중단</text>
<line x1="6" y1="248" x2="394" y2="248" stroke="#b4532a" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="40" y="234" width="320" height="28" rx="4" fill="#ffffff" stroke="#b4532a"/>
<text x="200" y="254" font-size="15" text-anchor="middle" fill="#b4532a" font-weight="700">접수통지 (안내는 접수 다음 날)</text>
<rect x="6" y="274" width="190" height="56" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="15" y="296" font-size="15" text-anchor="start" fill="#282d35">신청비 5만 원</text>
<text x="15" y="317" font-size="15" text-anchor="start" fill="#282d35">(7일 안)</text>
<path d="M101 330 v8 m-4 -4 l4 4 l4 -4" fill="none" stroke="#6f7783"/>
<rect x="6" y="340" width="190" height="56" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="15" y="362" font-size="15" text-anchor="start" fill="#282d35">예납금 1회분</text>
<text x="15" y="383" font-size="15" text-anchor="start" fill="#282d35">(14일 안)</text>
<rect x="204" y="274" width="190" height="98" rx="4" fill="#fdf3ee" stroke="#b4532a"/>
<text x="213" y="296" font-size="15" text-anchor="start" fill="#282d35">추심 금지</text>
<text x="213" y="317" font-size="15" text-anchor="start" fill="#282d35">본인·보증인 추심,</text>
<text x="213" y="338" font-size="15" text-anchor="start" fill="#282d35">가압류, 강제집행,</text>
<text x="213" y="359" font-size="15" text-anchor="start" fill="#282d35">소 제기</text>
<path d="M299 372 v8 m-4 -4 l4 4 l4 -4" fill="none" stroke="#6f7783"/>
<rect x="204" y="382" width="190" height="35" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="213" y="404" font-size="15" text-anchor="start" fill="#282d35">2주 안 채권신고</text>
<path d="M299 417 v8 m-4 -4 l4 4 l4 -4" fill="none" stroke="#6f7783"/>
<rect x="204" y="427" width="190" height="56" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="213" y="449" font-size="15" text-anchor="start" fill="#282d35">30일 안 조정안 심의</text>
<text x="213" y="470" font-size="15" text-anchor="start" fill="#282d35">(30일 더 가능)</text>
<path d="M299 483 v8 m-4 -4 l4 4 l4 -4" fill="none" stroke="#6f7783"/>
<rect x="204" y="493" width="190" height="56" rx="4" fill="#ffffff" stroke="#6f7783"/>
<text x="213" y="515" font-size="15" text-anchor="start" fill="#282d35">동의 회신 10일</text>
<text x="213" y="536" font-size="15" text-anchor="start" fill="#282d35">(답 없으면 동의)</text>
<rect x="6" y="563" width="388" height="34" rx="4" fill="#f2f6fb" stroke="#254a75"/>
<text x="200" y="586" font-size="15" text-anchor="middle" fill="#254a75" font-weight="700">합의서 체결: 접수부터 평균 약 두 달</text>
</svg>
