<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 260 372" role="img" aria-label="개인워크아웃 신청 절차" style="width:100%;height:auto;max-width:22rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><marker id="pf-arrow" viewbox="0 0 8 8" refx="6" refy="4" markerwidth="6" markerheight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cbcfd6"></path></marker></defs><g><rect x="12" y="12" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="32" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="0">1. 상담 예약 — 통지 안 감</tspan></text><line x1="130" y1="52" x2="130" y2="70" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="74" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="-6.5">2. 접수 — 전화 상담 후</tspan><tspan x="130" dy="13">완료</tspan></text><line x1="130" y1="114" x2="130" y2="132" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="136" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="156" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="0">3. 접수통지 — 추심금지 시작</tspan></text><line x1="130" y1="176" x2="130" y2="194" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="198" width="236" height="40" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="130" y="218" text-anchor="middle" font-size="11" font-weight="400" fill="#374151"><tspan x="130" dy="0">4. 채권신고(2주 이내)</tspan></text><line x1="130" y1="238" x2="130" y2="256" stroke="#cbcfd6" stroke-width="1.4" marker-end="url(#pf-arrow)"></line></g><g><rect x="12" y="260" width="236" height="40" rx="6" fill="#ffffff" stroke="