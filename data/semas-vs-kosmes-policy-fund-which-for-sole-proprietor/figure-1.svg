<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" role="img" aria-label="소진공 연 7천만원이 잔액 상한 안에 들어가고 중진공 60억은 따로인 그림" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<rect x="10" y="8" width="380" height="160" rx="8" fill="#f2f6fb" stroke="#254a75" stroke-width="2"/>
<text x="24" y="34" font-size="15" fill="#254a75">소진공 잔액 상한 (남은 잔액 + 신규 합산)</text>
<text x="24" y="58" font-size="15" fill="#282d35">운전자금 5억원 · 시설 포함 10억원</text>
<rect x="24" y="76" width="300" height="76" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="38" y="102" font-size="15" fill="#282d35">일반경영안정자금</text>
<text x="38" y="128" font-size="15" fill="#282d35">연 7천만원 (한 해 새로 받는 돈)</text>
<rect x="10" y="184" width="380" height="76" rx="8" fill="#ffffff" stroke="#6f7783" stroke-width="2"/>
<text x="24" y="212" font-size="15" fill="#6f7783">중진공 기업당 상한 60억원</text>
<text x="24" y="238" font-size="15" fill="#282d35">남은 잔액 + 새로 받을 돈 합산</text>
<text x="10" y="284" font-size="15" fill="#6f7783">칸 크기는 금액에 비례하지 않아요</text>
</svg>
