<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 340 316" role="img" aria-label="위에서 아래로 이어지는 순서. 2025년 1~12월: 병원 진료. 2026년 4월 이후: 소득분위 산정. 2026년 8월 31일: 안내문 순차 발송 시작. 2026년 9월 2일: 자동 지급 순차 시작(예정). 신청한 뒤: 신청형은 신청 뒤 지급. 3년이 지나면: 소멸 처리 (공단 자료: 2021·2022년 진료분 5만4002건). 상한제 환급은 진료받은 다음 해 8월 말쯤 정산된다." style="width:100%;height:auto;max-width:26rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><line x1="20" y1="14" x2="20" y2="244" stroke="#cbcfd6" stroke-width="2"></line><g><circle cx="20" cy="14" r="5" fill="#ffffff" stroke="#254a75" stroke-width="2"></circle><text x="38" y="11" font-size="11.5" font-weight="700" fill="#254a75">2025년 1~12월</text><text x="38" y="27" font-size="11.5" font-weight="400" fill="#374151">병원 진료</text></g><g><circle cx="20" cy="60" r="5" fill="#ffffff" stroke="#254a75" stroke-width="2"></circle><text x="38" y="57" font-size="11.5" font-weight="700" fill="#254a75">2026년 4월 이후</text><text x="38" y="73" font-size="11.5" font-weight="400" fill="#374151">소득분위 산정</text></g><g><circle cx="20" cy="106" r="6" fill="#b45309" stroke="#b45309" stroke-width="2"></circle><text x="38" y="103" font-size="11.5" font-weight="700" fill="#b45309">2026년 8월 31일</text><text x="38" y="119" font-size="11.5" font-weight="700" fill="#374151">안내문 순차 발송 시작</text></g><g><circle cx="20" cy="152" r="5" fill="#ffffff" stroke="#254a75" stroke-width="2"></circle><text x="38" y="149" font-size="11.5" font-weight="700" fill="#254a75">2026년 9월 2일</text><text x="38" y="165" font-size="11.5" font-weight="400" fill="#374151">자동 지급 순차 시작(예정)</text></g><g><circle cx="20" cy="198" r="5" fill="#ffffff" stroke="#254a75" stroke-width="2"></circle><text x="38" y="195" font-size="11.5" font-weight="700" fill="#254a75">신청한 뒤</text><text x="38" y="211" font-size="11.5" font-weight="400" fill="#374151">신청형은 신청 뒤 지급</text></g><g><rect x="15" y="239" width="10" height="10" fill="#9a3412"></rect><text x="38" y="241" font-size="11.5" font-weight="700" fill="#9a3412">3년이 지나면</text><text x="38" y="257" font-size="11.5" font-weight="700" fill="#374151">소멸 처리 (공단 자료: 2021·2022년 진료분 5만4002건)</text></g><rect x="6" y="270" width="328" height="26" rx="6" fill="#eff6ff" stroke="#254a75" stroke-width="1"></rect><text x="170" y="287" text-anchor="middle" font-size="11.5" fill="#374151">상한제 환급은 진료 다음 해 8월 말쯤 정산</text></svg>
