<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 340 262" role="img" aria-label="상한제 환급 신청·자동지급 구분" style="width:100%;height:auto;max-width:26rem" class="mx-auto block" font-family="Pretendard, 'Noto Sans KR', sans-serif"><defs><marker id="ba-arrow" viewbox="0 0 8 8" refx="6" refy="4" markerwidth="6" markerheight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"></path></marker></defs><rect x="85" y="6" width="170" height="30" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"></rect><text x="170" y="25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151"><tspan x="170" dy="0">상한제 환급 대상이에요</tspan></text><line x1="170" y1="36" x2="170" y2="54" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ba-arrow)"></line><rect x="55" y="58" width="230" height="40" rx="6" fill="#eff6ff" stroke="#254a75" stroke-width="1.4"></rect><text x="170" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151"><tspan x="170" dy="0">지급동의계좌를 미리 등록했나요?</tspan></text><path d="M110 98 V124" stroke="#9ca3af" stroke-width="1.4" fill="none" marker-end="url(#ba-arrow)"></path><path d="M230 98 V124" stroke="#9ca3af" stroke-width="1.4" fill="none" marker-end="url(#ba-arrow)"></path><text x="100" y="116" text-anchor="end" font-size="11.5" font-weight="700" fill="#15803d">예</text><text x="240" y="116" font-size="11.5" font-weight="700" fill="#b45309">아니오</text><rect x="14" y="128" width="152" height="70" rx="6" fill="#eef7f0" stroke="#15803d" stroke-width="1.4"></rect><text x="90" y="150" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151"><tspan x="90" dy="0">신청 없이 등록 계좌로</tspan><tspan x="90" dy="16">순차 지급</tspan><tspan x="90" dy="16">(9월 2일부터 예정)</tspan></text><rect x="174" y="128" width="152" height="70" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"></rect><text x="250" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151"><tspan x="250" dy="0">안내문(신청서 포함)을</tspan><tspan x="250" dy="16">받아 직접 신청해요</tspan></text><line x1="250" y1="198" x2="250" y2="214" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ba-arrow)"></line><rect x="174" y="218" width="152" height="30" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="250" y="236" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151"><tspan x="250" dy="0">본인 명의 계좌가 원칙</tspan></text></svg>
