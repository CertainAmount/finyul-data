<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="2025년 진료분 대상 226만 명 중 계좌 등록자 131만 명은 신청 없이 지급되고 10월 8일 뒤 지급분은 체납액을 뺄 수 있음, 나머지는 안내문 신청" font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <defs><marker id="bcr-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a93a3"/></marker></defs>
    <text x="200" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#282d35">2025년 진료분 대상 226만 명</text>
    <rect x="10" y="36" width="220" height="38" rx="4" fill="#e6effa" stroke="#254a75" stroke-width="1.4"/>
    <rect x="230" y="36" width="160" height="38" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="1.4"/>
    <text x="120" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#254a75">131만 명 · 58%</text>
    <text x="310" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">약 95만 명</text>
    <line x1="120" y1="76" x2="120" y2="100" stroke="#8a93a3" stroke-width="1.4" marker-end="url(#bcr-arrow)"/>
    <line x1="310" y1="76" x2="310" y2="100" stroke="#8a93a3" stroke-width="1.4" marker-end="url(#bcr-arrow)"/>
    <rect x="10" y="106" width="210" height="142" rx="6" fill="#ffffff" stroke="#254a75" stroke-width="1.4"/>
    <text x="115" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#282d35">계좌를 미리 등록</text>
    <text x="115" y="160" text-anchor="middle" font-size="15" fill="#282d35">9월 2일부터 신청 없이</text>
    <text x="115" y="184" text-anchor="middle" font-size="15" fill="#282d35">등록 계좌로 입금</text>
    <text x="115" y="208" text-anchor="middle" font-size="15" fill="#282d35">10월 8일 뒤 지급분은</text>
    <text x="115" y="232" text-anchor="middle" font-size="15" fill="#282d35">체납액을 뺄 수 있음</text>
    <rect x="230" y="106" width="160" height="142" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
    <text x="310" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#282d35">등록하지 않음</text>
    <text x="310" y="160" text-anchor="middle" font-size="15" fill="#282d35">안내문을 받고</text>
    <text x="310" y="184" text-anchor="middle" font-size="15" fill="#282d35">직접 신청</text>
    <text x="310" y="208" text-anchor="middle" font-size="15" fill="#282d35">본인 계좌가 원칙</text>
  </svg>
